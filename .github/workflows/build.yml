# OpenRAC mods: build, test and release (the OpenRAC mod SDK's workflow, sdk/template and
# sdk/template-script). The same file serves a repository of one mod (its openrac-mod.json at the
# top) and one of several (a folder per mod, as OpenRAC/openrac-mods), native mods, script mods or
# both: native mods are built from the top CMakeLists.txt, which makes every one of them; script
# mods ("type": "script", docs/port/MODS.md section 11) are packaged as they are, with no build.
#
# Each push and pull request: every native mod built and tested on Windows, Linux and macOS, and
# built for Android, against the SDK sdk.lock pins (tools/fetch_sdk.py), each platform's build
# packaged as <id>-<version>-<platform>.zip and the platforms joined into <id>-<version>.zip; every
# script mod packaged as <id>-<version>.zip; and SHA256SUMS over them all: the run's artifacts. A tag
# v<version> (or <id>-v<version>) also publishes them on that release, which is what OpenRAC's
# launcher installs from when a player pastes the repository's address (MODS.md, section 10):
# push a tag, nothing else. The libraries are not signed.
#
# ArchipelagoRAC2's own steps: the client is packaged by tools/package_native_mod.py (which adds
# the original APRac2 MIT notice and the credits to each archive), and the APWorld and the YAML
# template are published beside the archives.
#
# The SDK: OpenRAC's own sdk/ at OPENRAC_REF below, the commit OpenRAC's dev launcher
# (launcher-dev-develop, v1.1.1-dev.1291) was built from: mod API 1.40, the gameplay queries and the
# RAC2 inventory and story hooks, which no SDK release has yet. Pinned to a commit, not the branch,
# so every build is the same and matches that dev build. Once OpenRAC publishes Mod SDK 1.40 or
# later, go back to the SDK template's step (python tools/fetch_sdk.py, sdk.lock) in each job and
# drop OPENRAC_REF and -DOPENRAC_SDK.
#
# Every action is pinned to a commit.
name: build

on:
  push:
    branches: [main]
    tags: ["v*", "*-v*"]
  pull_request:
  workflow_dispatch:

env:
  OPENRAC_REF: b005a7b36f324394abbc42f41dfeb25a56276a25

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What the repository holds: native mods to build (a top CMakeLists.txt), script mods to package.
  detect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      native: ${{ steps.find.outputs.native }}
      scripts: ${{ steps.find.outputs.scripts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find the mods
        id: find
        shell: python
        run: |
          import json, os, pathlib
          root = pathlib.Path(".")
          index = root / "openrac-mods.json"
          if index.is_file():
              folders = [root / f for f in json.loads(index.read_text())["mods"]]
          elif (root / "openrac-mod.json").is_file():
              folders = [root]
          else:
              folders = sorted(p.parent for p in root.glob("*/openrac-mod.json"))
          scripts = [f.as_posix() for f in folders
                     if json.loads((f / "openrac-mod.json").read_text()).get("type") == "script"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"native={'true' if (root / 'CMakeLists.txt').is_file() else 'false'}\n")
              out.write(f"scripts={' '.join(scripts)}\n")
          print("native mods:", (root / "CMakeLists.txt").is_file(), "script mods:", scripts or "none")

  build:
    needs: detect
    if: needs.detect.outputs.native == 'true'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Visual Studio's compiler, x64, with Ninja in its environment (Set up MSVC below).
          - name: windows-x86_64
            os: windows-2025
          # Ubuntu 22.04, the oldest the runners offer: a library built here needs glibc 2.35 or
          # later, what the launcher's Linux game needs too.
          - name: linux-x86_64
            os: ubuntu-22.04
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          # Apple silicon, and Intel cross-built on the same runner (one architecture per build).
          - name: macos-arm64
            os: macos-15
            configure: -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          - name: macos-x86_64
            os: macos-15
            configure: -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
            # An Intel build's tests cannot run on an Apple silicon runner without Rosetta.
            skip_tests: true
          # Android (OpenRAC's app, arm64): the runner's NDK, cross-built, no test run here.
          - name: android-arm64
            os: ubuntu-24.04
            configure: >-
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake
              -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28
            skip_tests: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Ninja
        run: python -m pip install ninja
      - name: Set up MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" | Out-File -Append $env:GITHUB_ENV }
          }
      - name: OpenRAC's SDK at OPENRAC_REF
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenRAC/OpenRAC
          ref: ${{ env.OPENRAC_REF }}
          path: .openrac
          sparse-checkout: sdk
          persist-credentials: false
      - name: The SDK
        shell: bash
        run: echo "SDK=$(python -c 'import pathlib; print(pathlib.Path(".openrac/sdk").resolve().as_posix())')" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOPENRAC_SDK="$SDK" ${{ matrix.configure }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        if: ${{ !matrix.skip_tests }}
        run: ctest --test-dir build --output-on-failure --no-tests=ignore
      - name: Package
        run: |
          # The client's folder as openrac_add_mod laid it out, with the APRac2 notice and credits,
          # checked and zipped for this platform.
          python tools/package_native_mod.py --sdk "$SDK" --input build/package/aprac2_client --output dist
          ls -l dist
          for zip in dist/*.zip; do
            case "$zip" in
              *-"$NAME".zip) ;;
              *) echo "::error::$zip is not for $NAME"; exit 1 ;;
            esac
          done
        env:
          NAME: ${{ matrix.name }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mods-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error

  # Script mods: checked and packaged from their own folders, one archive for every platform.
  scripts:
    needs: detect
    if: needs.detect.outputs.scripts != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: OpenRAC's SDK at OPENRAC_REF
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenRAC/OpenRAC
          ref: ${{ env.OPENRAC_REF }}
          path: .openrac
          sparse-checkout: sdk
          persist-credentials: false
      - name: The SDK
        shell: bash
        run: echo "SDK=$(python -c 'import pathlib; print(pathlib.Path(".openrac/sdk").resolve().as_posix())')" >> "$GITHUB_ENV"
      - name: Package
        env:
          FOLDERS: ${{ needs.detect.outputs.scripts }}
        run: |
          # shellcheck disable=SC2086 # one folder per word
          python "$SDK/tools/package_mod.py" $FOLDERS -o dist
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mods-scripts
          path: dist/*.zip
          if-no-files-found: error

  # Each native mod's archives of every platform joined into one, <id>-<version>.zip, beside the
  # script mods' archives, and SHA256SUMS over every archive, which the launcher checks each
  # download against.
  merge:
    needs: [build, scripts]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: OpenRAC's SDK at OPENRAC_REF
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenRAC/OpenRAC
          ref: ${{ env.OPENRAC_REF }}
          path: .openrac
          sparse-checkout: sdk
          persist-credentials: false
      - name: The SDK
        shell: bash
        run: echo "SDK=$(python -c 'import pathlib; print(pathlib.Path(".openrac/sdk").resolve().as_posix())')" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mods-*
          path: dist
          merge-multiple: true
      - name: Join the platforms, list the hashes
        run: |
          # A native mod's platform archives, <id>-<version>-<platform>.zip: the platform is the last
          # two words, the rest the mod. A script mod's archive is already the one for every platform.
          platforms='-(macos|linux|windows|android)-[a-z0-9_]+\.zip$'
          for mod in $(ls dist/*.zip | grep -E -- "$platforms" | sed -E 's#.*/(.*)-[a-z]+-[a-z0-9_]+\.zip#\1#' | sort -u); do
            python "$SDK/tools/package_mod.py" --merge dist/"$mod"-*.zip -o dist/"$mod".zip
          done
          # The APWorld and the YAML template, for the Archipelago side.
          python tools/package_apworld.py
          cp templates/ArchipelagoRAC2.yaml dist/
          (cd dist && sha256sum *.zip *.apworld *.yaml > SHA256SUMS)
          cat dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mods
          path: |
            dist/*.zip
            dist/*.apworld
            dist/*.yaml
            dist/SHA256SUMS
          if-no-files-found: error

  # A tag: every archive and SHA256SUMS on the tag's release, published, for the launcher.
  release:
    needs: merge
    if: ${{ !cancelled() && needs.merge.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mods
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          sdk="OpenRAC/OpenRAC@$OPENRAC_REF (the dev launcher's build: mod API 1.40)"
          printf 'Built by the build workflow from %s, against the OpenRAC mod SDK of %s.\n\nInstall: paste this repository'"'"'s address in the OpenRAC launcher'"'"'s Mods tab, or add a .zip there.\n' \
            "$GITHUB_SHA" "$sdk" > notes.md
          # A tag <id>-v<version> releases that one mod of a repository of several: only its
          # archives, and SHA256SUMS listing them. v<version> releases every mod.
          case "$TAG" in
            v[0-9]*) ;;
            *-v[0-9]*)
              mod="${TAG%-v*}" version="${TAG##*-v}"
              ls dist/"$mod-$version"*.zip > /dev/null 2>&1 || { echo "::error::$TAG: no archive of $mod $version"; exit 1; }
              find dist -name '*.zip' ! -name "$mod-$version.zip" ! -name "$mod-$version-*.zip" -delete
              (cd dist && sha256sum *.zip > SHA256SUMS)
              ;;
          esac
          ls dist
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" --clobber dist/*
          else
            gh release create "$TAG" --title "ArchipelagoRAC2 $TAG - Experimental" --prerelease --notes-file notes.md --verify-tag dist/*
          fi
